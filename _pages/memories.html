/* =========================================================
   Initialize Map
========================================================= */

const mapElement =
  document.getElementById(
    "activityChinaMap"
  );

const activityMap =
  echarts.init(mapElement);



/*
 * 使用公开 GeoJSON。
 * GitHub Pages 上可直接访问。
 */

fetch(
  "https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json"
)

.then(response => response.json())

.then(chinaGeoJSON => {

  echarts.registerMap(
    "AIMS-China",
    chinaGeoJSON
  );


  const option = {

    backgroundColor:
      "transparent",


    tooltip: {

      trigger: "item",

      backgroundColor:
        "rgba(9,20,36,.95)",

      borderColor:
        "rgba(100,160,255,.35)",

      textStyle: {
        color: "#eef5ff"
      },

      formatter: params => {

        if (
          params.seriesType ===
          "effectScatter"
        ) {

          const d =
            activityLocations.find(
              item =>
                item.name ===
                params.name
            );

          return `
            <strong>
              ${d.name}
            </strong>
            <br>
            ${d.chinese}
          `;

        }

        return "";

      }

    },


    geo: {

      map:
        "AIMS-China",

      roam:
        false,

      zoom:
        1.08,

      top:
        "5%",

      bottom:
        "6%",

      left:
        "3%",

      right:
        "3%",


      label: {
        show: false
      },


      itemStyle: {

        areaColor:
          "#0d223d",

        borderColor:
          "rgba(103,157,235,.48)",

        borderWidth:
          0.7

      },


      emphasis: {

        disabled:
          true

      }

    },


    series: [

      /* =====================
         Glow
      ===================== */

      {

        name:
          "Activity Glow",

        type:
          "effectScatter",

        coordinateSystem:
          "geo",

        zlevel:
          2,

        data:
          activityLocations,

        symbolSize:
          16,

        showEffectOn:
          "render",

        rippleEffect: {

          brushType:
            "stroke",

          scale:
            2.8,

          period:
            4

        },

        itemStyle: {

          color:
            "#4e96ff",

          shadowBlur:
            18,

          shadowColor:
            "#4e96ff"

        },

        label: {

          show:
            true,

          position:
            "right",

          distance:
            7,

          color:
            "#dcecff",

          fontSize:
            10,

          formatter:
            params =>
              params.name

        },

        emphasis: {

          scale:
            1.4

        }

      }

    ]

  };


  activityMap.setOption(
    option
  );



  /* =====================================================
     Click Map Marker → Highlight Gallery Image
  ====================================================== */

  activityMap.on(
    "click",
    params => {

      if (
        params.seriesType !==
        "effectScatter"
      ) return;


      const cards =
        document.querySelectorAll(
          ".activity-card"
        );


      cards.forEach(card => {

        card.classList.remove(
          "city-active"
        );

      });


      const target =
        document.querySelector(
          `.activity-card[data-city="${params.name}"]`
        );


      if (target) {

        target.classList.add(
          "city-active"
        );


        target.scrollIntoView({

          behavior:
            "smooth",

          block:
            "center"

        });


        setTimeout(() => {

          target.classList.remove(
            "city-active"
          );

        }, 2600);

      }

    }
  );

})

.catch(error => {

  console.error(
    "China map failed to load:",
    error
  );

});



/* =========================================================
   Responsive ECharts
========================================================= */

window.addEventListener(
  "resize",
  () => {

    activityMap.resize();

  }
);



/* =========================================================
   Photo Lightbox
========================================================= */

const lightbox =
  document.getElementById(
    "activityLightbox"
  );

const lightboxImg =
  document.getElementById(
    "activityLightboxImage"
  );

const lightboxLocation =
  document.getElementById(
    "activityLightboxLocation"
  );

const lightboxTitle =
  document.getElementById(
    "activityLightboxTitle"
  );

const lightboxDescription =
  document.getElementById(
    "activityLightboxDescription"
  );

const closeBtn =
  document.getElementById(
    "activityLightboxClose"
  );


document
.querySelectorAll(
  ".activity-card"
)
.forEach(card => {

  card.addEventListener(
    "click",
    () => {

      const img =
        card.querySelector(
          "img"
        );

      const location =
        card.querySelector(
          ".photo-location"
        );

      const title =
        card.querySelector(
          "h4"
        );

      const description =
        card.querySelector(
          "p"
        );


      lightboxImg.src =
        img.src;

      lightboxImg.alt =
        img.alt;

      lightboxLocation.textContent =
        location.innerText;

      lightboxTitle.textContent =
        title.innerText;

      lightboxDescription.textContent =
        description.innerText;


      lightbox.classList.add(
        "is-open"
      );


      document.body.style.overflow =
        "hidden";

    }
  );

});


function closeActivityLightbox() {

  lightbox.classList.remove(
    "is-open"
  );

  document.body.style.overflow =
    "";

}


closeBtn.addEventListener(
  "click",
  closeActivityLightbox
);


lightbox.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      lightbox
    ) {

      closeActivityLightbox();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closeActivityLightbox();

    }

  }
);



/* =========================================================
   Image Fallback

   如果图片路径暂时不存在，
   自动显示一个深色占位背景，
   不会出现浏览器难看的 broken image 图标。
========================================================= */

document
.querySelectorAll(
  ".activity-card img"
)
.forEach(img => {

  img.addEventListener(
    "error",
    () => {

      const svg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1200"
          height="800"
        >

          <defs>

            <linearGradient
              id="g"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >

              <stop
                offset="0"
                stop-color="#122a49"
              />

              <stop
                offset="1"
                stop-color="#07111f"
              />

            </linearGradient>

          </defs>


          <rect
            width="100%"
            height="100%"
            fill="url(#g)"
          />


          <circle
            cx="600"
            cy="360"
            r="100"
            fill="#4e96ff"
            opacity=".08"
          />


          <text
            x="50%"
            y="48%"
            dominant-baseline="middle"
            text-anchor="middle"
            font-family="Arial"
            font-size="30"
            fill="#91bdf8"
          >
            Academic Moments
          </text>


          <text
            x="50%"
            y="54%"
            dominant-baseline="middle"
            text-anchor="middle"
            font-family="Arial"
            font-size="16"
            fill="#718aa9"
          >
            Replace with your activity photo
          </text>

        </svg>
      `;


      img.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

    },

    {
      once: true
    }

  );

});

</script>
